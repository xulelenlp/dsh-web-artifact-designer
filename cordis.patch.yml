# dsh-web-artifact-designer bundle: registers skills/<name>/SKILL.md in this
# package on ctx.skills. Applied after @deepseek-ai/dsh-base, which already
# mounts the skill registry and the model-facing skill loader, so the skill
# ships with the profile instead of having to be copied into ~/.dsh/skills.
- insert:
    - id: web-artifact-designer
      name: dsh-web-artifact-designer
